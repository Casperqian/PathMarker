# @package _global_
defaults:
  - _self_

# =========================
# Dataset selection
# =========================

dataset_key: DatasetA

# =========================
# Paths (fully specified)
# =========================
paths:
  # experiments will be subfolders of this
  base_experiment_log_dir: /home/qzengar/PathSegmentorV2/sam3/exps/pathseg_evals

  # per-dataset log dir (specific override)
  experiment_log_dir: ${paths.base_experiment_log_dir}/sam3/${dataset_key}

  # checkpoint (specific override)
  checkpoint_path: /home/qzengar/PathSegmentorV2/sam3/exps/pathseg_labeled_ft/checkpoints/checkpoint.pt

  # tokenizer BPE
  bpe_path: /home/qzengar/PathSegmentorV2/sam3/sam3/assets/bpe_simple_vocab_16e6.txt.gz

# =========================
# Scratch: helper params / transforms / postprocessors
# =========================
scratch:
  use_presence_eval: true

  # Image processing params
  resolution: 1008
  max_ann_per_img: 200
  context_length: 2

  # Normalization params
  train_norm_mean: [0.5, 0.5, 0.5]
  train_norm_std:  [0.5, 0.5, 0.5]
  val_norm_mean:   [0.5, 0.5, 0.5]
  val_norm_std:    [0.5, 0.5, 0.5]

  # DataLoader params (eval)
  train_batch_size: 1
  val_batch_size: 64
  num_train_workers: 0
  num_val_workers: 16
  max_data_epochs: 20
  target_epoch_size: 1500
  hybrid_repeats: 1

  # Gather predictions
  gather_pred_via_filesys: false

  # (unused for eval, keep for completeness)
  lr_scale: 0.1
  lr_transformer: ${times:8e-4,${scratch.lr_scale}}
  lr_vision_backbone: ${times:2.5e-4,${scratch.lr_scale}}
  lr_language_backbone: ${times:5e-5,${scratch.lr_scale}}
  lrd_vision_backbone: 0.9
  wd: 0.1
  scheduler_timescale: 20
  scheduler_warmup: 20
  scheduler_cooldown: 20

  # Model params
  d_model: 256
  input_box_embedding_dim: ${add:${scratch.d_model},2}

  # Transforms (val)
  base_val_transform:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes: ${scratch.resolution}
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: false
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.val_norm_mean}
          std: ${scratch.val_norm_std}

  # Postprocessors
  original_box_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1
    use_original_ids: true
    use_original_sizes_box: true
    use_presence: ${scratch.use_presence_eval}

  box_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1
    use_original_ids: false
    use_original_sizes_box: false
    use_presence: ${scratch.use_presence_eval}

  box_postprocessor_thresholded:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1
    use_original_ids: false
    use_original_sizes_box: false
    detection_threshold: 0.3
    use_presence: ${scratch.use_presence_eval}

  mask_postprocessor_thresholded:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1
    iou_type: "segm"
    use_original_ids: true
    use_original_sizes_box: true
    use_original_sizes_mask: true
    convert_mask_to_rle: false
    detection_threshold: 0.3
    use_presence: ${scratch.use_presence_eval}

  # loss unused for eval
  loss: null

  # enable segmentation flag (specific uses this through scratch.enable_segmentation; define explicitly)
  enable_segmentation: true

# =========================
# Trainer (fully specified)
# =========================
trainer:
  _target_: sam3.train.trainer.Trainer
  mode: val

  skip_saving_ckpts: true
  empty_gpu_mem_cache_after_eval: true
  skip_first_val: true

  max_epochs: ${scratch.max_data_epochs}
  accelerator: cuda
  seed_value: 123
  val_epoch_freq: 10

  distributed:
    backend: nccl
    find_unused_parameters: true
    gradient_as_bucket_view: true

  loss:
    all:
      _target_: sam3.train.loss.sam3_loss.DummyLoss
    default:
      _target_: sam3.train.loss.sam3_loss.DummyLoss

  data:
    train: null
    val:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.custom_image_dataset.PathDataset
        dataset_name: ${dataset_key}
        transforms: ${scratch.base_val_transform}
        load_segmentation: ${scratch.enable_segmentation}
        training: false
        use_caching: false
        return_geometry: false
        return_box_prob: 0.0
        return_point_prob: 0.0
        
      shuffle: false
      batch_size: ${scratch.val_batch_size}
      num_workers: ${scratch.num_val_workers}
      pin_memory: false
      drop_last: false
      collate_fn:
        _target_: sam3.train.data.collator.collate_fn_api
        _partial_: true
        repeats: ${scratch.hybrid_repeats}
        dict_key: internal
        with_seg_masks: ${scratch.enable_segmentation}

  model:
    _target_: sam3.model_builder.build_pathmarker_semantic_model
    bpe_path: ${paths.bpe_path}
    device: cpus
    eval_mode: true
    enable_segmentation: true
    checkpoint_path: ${paths.checkpoint_path}

  meters:
    val:
      internal:
        cgf1:
          _target_: sam3.eval.coco_writer.SemanticSegmentationMetricsWriter
          iou_type: "segm"
          dump_dir: ${paths.experiment_log_dir}/dumps/${dataset_key}_internal
          merge_predictions: true
          postprocessor: ${scratch.mask_postprocessor_thresholded}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: 1000000

  optim:
    amp:
      enabled: true
      amp_dtype: bfloat16

    optimizer:
      _target_: torch.optim.AdamW

    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2

    param_group_modifiers:
      - _target_: sam3.train.optim.optimizer.layer_decay_param_modifier
        _partial_: true
        layer_decay_value: ${scratch.lrd_vision_backbone}
        apply_to: 'backbone.vision_backbone.trunk'
        overrides:
          - pattern: '*pos_embed*'
            value: 1.0

    options:
      lr:
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_transformer}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_vision_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names: ['backbone.vision_backbone.*']
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_language_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names: ['backbone.language_backbone.*']

      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names: ['*bias*']
          module_cls_names: ['torch.nn.LayerNorm']

  checkpoint:
    save_dir: ${paths.experiment_log_dir}/checkpoints
    save_freq: 0

  logging:
    tensorboard_writer:
      _target_: sam3.train.utils.logger.make_tensorboard_logger
      log_dir: ${paths.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: false
    wandb_writer:
      _target_: sam3.train.utils.logger.make_wandb_logger_multi_axis
      project: "pathseg_evals"
      name: ${paths.experiment_log_dir} + ${dataset_key}
      dir: ${launcher.experiment_log_dir}
      config: ${scratch}
      should_log: True
    log_dir: ${paths.experiment_log_dir}/logs/
    log_freq: 50

# =========================
# Launcher (keep for code compatibility)
# =========================
launcher:
  num_nodes: 1
  gpus_per_node: 2
  experiment_log_dir: ${paths.experiment_log_dir}
  multiprocessing_context: forkserver

# =========================
# Submitit / Cluster params (your requested overrides)
# =========================
submitit:
  account: null           # Add your SLURM account if use_cluster == 1
  partition: null
  qos: null               # Add your QoS if use_cluster == 1
  timeout_hour: 72
  use_cluster: true
  cpus_per_task: 10
  port_range: [10000, 65000]
  constraint: null
