# @package _global_
defaults:
  - _self_

paths:
  pathseg_instance_root: /path/to/your/data/instances
  experiment_log_dir: exps/pathseg_instance_ft
  bpe_path: sam3/assets/bpe_simple_vocab_16e6.txt.gz
  sam3_checkpoint: ${oc.env:SAM3_CHECKPOINT,ckpt/sam3.pt}
  semantic_checkpoint: ${oc.env:SEMANTIC_CHECKPOINT,exps/siglip_labeled_ft/checkpoints/best.pt}

pathseg_instance_train:
  supercategory: ${all_pathseg_instance_supercategories.${string:${submitit.job_array.task_index}}}

  train_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterCrowds
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes:
            _target_: sam3.train.transforms.basic.get_random_resize_scales
            size: ${scratch.resolution}
            min_size: ${scratch.train_resize_min_size}
            rounded: false
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.PadToSizeAPI
          size: ${scratch.resolution}
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets

  val_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes: ${scratch.resolution}
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: false
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.val_norm_mean}
          std: ${scratch.val_norm_std}

  # NOTE: Loss to be used for instance segmentation.
  loss:
    _target_: sam3.train.loss.sam3_loss.DebugSam3LossWrapper
    matcher: ${scratch.matcher}
    o2m_weight: 2.0
    o2m_matcher:
      _target_: sam3.train.matcher.BinaryOneToManyMatcher
      alpha: 0.3
      threshold: 0.4
      topk: 4
    use_o2m_matcher_on_o2m_aux: false
    loss_fns_find:
      - _target_: sam3.train.loss.loss_fns.Boxes
        weight_dict:
          loss_bbox: 5.0
          loss_giou: 2.0
      - _target_: sam3.train.loss.loss_fns.IABCEMdetr
        weak_loss: False
        weight_dict:
          loss_ce: 20.0 # Another option is 100.0
          presence_loss: 20.0
        pos_weight: 10.0 # Another option is 5.0
        alpha: 0.25
        presence_gamma: 2.0
        gamma: 2
        use_presence: True  # Change
        pos_focal: false
        pad_n_queries: ${scratch.num_queries}
        pad_scale_pos: 1.0
      - _target_: sam3.train.loss.loss_fns.Masks
        focal_alpha: 0.25
        focal_gamma: 2.0
        weight_dict:
          loss_mask: 200.0
          loss_dice: 10.0
        compute_aux: false
    scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

scratch:
  enable_segmentation: true
  d_model: 256

  resolution: 1008
  train_resize_min_size: 640
  consistent_transform: false
  num_queries: 300
  separate_instance_pixel_decoder: true
  max_instances_per_image: null
  max_ann_per_img: 1000000
  eval_patch_size: 256
  eval_patch_stride: 192
  eval_max_dets_per_patch: 300
  eval_patch_pre_nms_topk: 2000
  eval_patch_nms_iou_threshold: 0.7
  eval_target_max_instances_per_image: -1
  eval_adaptive_inference: false
  eval_adaptive_threshold: 250
  eval_adaptive_min_size: 256
  eval_adaptive_max_depth: 2
  eval_adaptive_context: 0
  instance_enable_morph_postprocess: false
  instance_postprocess_min_instance_area: 16
  instance_postprocess_hole_area: 16
  instance_postprocess_split_components: true

  train_norm_mean: [0.5, 0.5, 0.5]
  train_norm_std: [0.5, 0.5, 0.5]
  val_norm_mean: [0.5, 0.5, 0.5]
  val_norm_std: [0.5, 0.5, 0.5]

  use_presence_eval: false
  instance_postprocessor:
    _target_: sam3.eval.instance_seg_writer.InstancePostProcessImage
    max_dets_per_img: ${scratch.max_ann_per_img}
    iou_type: "segm"
    use_original_ids: true
    use_original_sizes_box: true
    use_original_sizes_mask: true
    detection_threshold: 0.5
    use_presence: ${scratch.use_presence_eval}
    always_interpolate_masks_on_gpu: true
    aggregate_patches: true
    max_dets_per_patch: ${scratch.eval_max_dets_per_patch}
    patch_pre_nms_topk: ${scratch.eval_patch_pre_nms_topk}
    patch_nms_iou_threshold: ${scratch.eval_patch_nms_iou_threshold}
    target_max_instances_per_image: ${scratch.eval_target_max_instances_per_image}
    enable_morph_postprocess: ${scratch.instance_enable_morph_postprocess}
    postprocess_min_instance_area: ${scratch.instance_postprocess_min_instance_area}
    postprocess_hole_area: ${scratch.instance_postprocess_hole_area}
    postprocess_split_components: ${scratch.instance_postprocess_split_components}

  matcher:
    _target_: sam3.train.matcher.BinaryHungarianMatcherV2
    focal: true
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2
    stable: false

  scale_by_find_batch_size: true

  num_train_workers: 4
  num_val_workers: 2
  instance_metric_workers: 2
  instance_metric_queue_size: 4
  gather_pred_via_filesys: false

  lr_scale: 0.1
  lr_transformer: ${times:8e-4,${scratch.lr_scale}}
  lr_vision_backbone: ${times:2.5e-4,${scratch.lr_scale}}
  lr_language_backbone: ${times:5e-5,${scratch.lr_scale}}
  lrd_vision_backbone: 0.9
  wd: 0.1
  scheduler_timescale: 100
  scheduler_warmup: 100
  scheduler_cooldown: 100

  train_batch_size: 32
  val_batch_size: 1
  gradient_accumulation_steps: 4
  hybrid_repeats: 1

  collate_fn:
    _target_: sam3.train.data.collator.collate_fn_api_with_chunking
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: all
    with_seg_masks: true
    num_chunks: ${scratch.gradient_accumulation_steps}

  collate_fn_val:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: all
    with_seg_masks: false

trainer:
  _target_: sam3.train.trainer.Trainer
  skip_saving_ckpts: false
  empty_gpu_mem_cache_after_eval: true
  skip_first_val: true
  max_epochs: 20
  accelerator: cuda
  seed_value: 123
  val_epoch_freq: 1
  mode: train
  gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}

  distributed:
    backend: nccl
    find_unused_parameters: true
    gradient_as_bucket_view: true

  loss:
    all: ${pathseg_instance_train.loss}
    default:
      _target_: sam3.train.loss.sam3_loss.DummyLoss

  data:
    train:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.custom_instance_dataset.InstancePathDataset
        root: ${paths.pathseg_instance_root}
        dataset_name: ${pathseg_instance_train.supercategory}
        transforms: ${pathseg_instance_train.train_transforms}
        load_segmentation: ${scratch.enable_segmentation}
        training: true
        split: train
        split_seed: ${trainer.seed_value}
        use_caching: false
        return_geometry: true
        return_box_prob: 0.1
        return_point_prob: 0.2
        max_input_points: 10
        min_instance_area: 1
        max_instances_per_image: ${scratch.max_instances_per_image}

      shuffle: true
      batch_size: ${scratch.train_batch_size}
      num_workers: ${scratch.num_train_workers}
      pin_memory: true
      drop_last: true
      collate_fn: ${scratch.collate_fn}
      prefetch_factor: 1

    val:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.custom_instance_dataset.InstancePathDataset
        root: ${paths.pathseg_instance_root}
        dataset_name: ${pathseg_instance_train.supercategory}
        transforms: ${pathseg_instance_train.val_transforms}
        load_segmentation: false
        training: false
        split: val
        split_seed: ${trainer.seed_value}
        use_caching: false
        return_raw_images: false
        return_geometry: false
        min_instance_area: 1
        max_instances_per_image: null
        patchify_eval: true
        patch_size: ${scratch.eval_patch_size}
        patch_stride: ${scratch.eval_patch_stride}

      shuffle: false
      batch_size: ${scratch.val_batch_size}
      num_workers: ${scratch.num_val_workers}
      pin_memory: true
      drop_last: false
      collate_fn: ${scratch.collate_fn_val}

  model:
    _target_: sam3.model_builder.build_sam3_image_model
    bpe_path: ${paths.bpe_path}
    checkpoint_path: ${paths.sam3_checkpoint}
    device: cpu
    eval_mode: false
    enable_segmentation: ${scratch.enable_segmentation}
    enable_matcher: true
    num_queries: ${scratch.num_queries}
    separate_instance_pixel_decoder: ${scratch.separate_instance_pixel_decoder}
    checkpoint_path_partial: ${paths.semantic_checkpoint}
    module_prefixes:
      - backbone.
      - geometry_encoder.
      - transformer.encoder.
      - segmentation_head.pixel_decoder.
      - segmentation_head.semantic_seg_head.
      - segmentation_head.cross_attend_prompt.
      - segmentation_head.cross_attn_norm.

  meters:
    val:
      all:
        instance_seg:
          _target_: sam3.eval.instance_seg_writer.InstanceSegDumper
          iou_type: "segm"
          dump_dir: ${launcher.experiment_log_dir}/dumps/pathseg_instance/${pathseg_instance_train.supercategory}
          merge_predictions: true
          postprocessor: ${scratch.instance_postprocessor}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: ${scratch.max_ann_per_img}
          adaptive_inference: ${scratch.eval_adaptive_inference}
          adaptive_threshold: ${scratch.eval_adaptive_threshold}
          adaptive_min_size: ${scratch.eval_adaptive_min_size}
          adaptive_max_depth: ${scratch.eval_adaptive_max_depth}
          adaptive_context: ${scratch.eval_adaptive_context}
          metric_workers: ${scratch.instance_metric_workers}
          metric_queue_size: ${scratch.instance_metric_queue_size}

  optim:
    amp:
      enabled: true
      amp_dtype: bfloat16
    optimizer:
      _target_: torch.optim.AdamW
    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2
    param_group_modifiers:
      - _target_: sam3.train.optim.optimizer.layer_decay_param_modifier
        _partial_: true
        layer_decay_value: ${scratch.lrd_vision_backbone}
        apply_to: 'backbone.vision_backbone.trunk'
        overrides:
          - pattern: '*pos_embed*'
            value: 1.0
    options:
      lr:
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_transformer}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_vision_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.vision_backbone.*'
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_language_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.language_backbone.*'
      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - '*bias*'
          module_cls_names: ['torch.nn.LayerNorm']

  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 1

  logging:
    tensorboard_writer:
      _target_: sam3.train.utils.logger.make_tensorboard_logger
      log_dir: ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: false
    wandb_writer:
      _target_: sam3.train.utils.logger.make_wandb_logger_multi_axis
      project: "pathseg_instance_ft"
      dir: ${launcher.experiment_log_dir}
      config: ${scratch}
      should_log: true
    log_dir: ${launcher.experiment_log_dir}/logs/${pathseg_instance_train.supercategory}
    log_freq: 100

freezing:
  strategy: 'none'
  freeze_vision_backbone: true
  freeze_language_backbone: true
  freeze_vision_neck: true
  freeze_geometry_encoder: true
  freeze_transformer_encoder: true
  freeze_seg_pixel_decoder: true
  freeze_semantic_seg_head: true
  freeze_seg_prompt_cross_attn: true

launcher:
  num_nodes: 1
  gpus_per_node: 8
  experiment_log_dir: ${paths.experiment_log_dir}
  multiprocessing_context: forkserver

submitit:
  account: null
  partition: null
  qos: null
  timeout_hour: 72
  use_cluster: true
  cpus_per_task: 10
  port_range: [10000, 65000]
  constraint: null
  job_array:
    num_tasks: 1
    task_index: 0

all_pathseg_instance_supercategories:
  - all
